$:
  vscode:
    - docker:
        build: .ide/Dockerfile
      services:
        - vscode
        - docker
      # 开发环境启动后会执行的任务
      stages:
        - name: setup env
          script: chown -R codespace:codespace /workspace && su codespace
        - name: say hi
          script: echo "hi"

# CNB → GitHub：官方 tencentcom/git-sync 插件，push 模式。
# - 不改写提交 → 两边 SHA 一致，无需旧的 [sync] 前缀防循环
# - 不设置 force → 非强推；GitHub 侧有 CNB 没见过的提交时会失败而不是覆盖
#   （插件 ${PLUGIN_FORCE:+--force} 的特性：force 只要非空就强推，连 "false" 也算，
#    所以这里绝对不能写 force 字段）
x-sync-to-github: &sync-to-github
  - imports:
      - https://cnb.cool/miojizzy/secrets/-/blob/main/github-secrets.yml
    stages:
      - name: sync to github
        image: tencentcom/git-sync
        settings:
          target_url: https://github.com/miojizzy/auto-ss-server.git
          auth_type: https
          username: miojizzy
          password: ${GITHUB_TOKEN}
          branch: main

# 只同步 main。新增分支时，为每个分支复制一份并改 branch，不要把 branch 写死成 main。
main:
  push: *sync-to-github
