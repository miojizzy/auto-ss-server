$:
  vscode:
    - docker:
        build: .ide/Dockerfile
      services:
        - vscode
        - docker
      # 开发环境启动后会执行的任务
      stages:
        - name: setup env
          script: chown -R codespace:codespace /workspace && su codespace
        - name: say hi
          script: echo "hi"

