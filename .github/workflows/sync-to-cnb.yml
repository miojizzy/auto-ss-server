name: Sync to CNB

# ⚠️ 已临时停用（2026-10-27）：CNB↔GitHub 同步正在迁移到官方 tencentcom/git-sync 插件。
# 为避免旧 [sync] amend 方案与迁移过程互相覆盖，这里先停掉自动触发；
# 新配置验证后会由下一个提交恢复（届时触发只保留 main）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: noop
        run: echo "sync-to-cnb is temporarily disabled (migrating to tencentcom/git-sync)"

