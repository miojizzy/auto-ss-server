name: Sync to CNB

# GitHub 为源，CNB 为镜像。
# 使用官方 tencentcom/git-sync 插件：不改写提交，两边 SHA 一致。
# 注意：不要设置 PLUGIN_FORCE。插件用 ${PLUGIN_FORCE:+--force} 判断，
# 只要该变量非空（包括字符串 "false"）就会强推；不设置才是安全的默认行为。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-cnb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to CNB
        uses: docker://tencentcom/git-sync
        env:
          PLUGIN_TARGET_URL: "https://cnb.cool/miojizzy/auto-ss-server.git"
          PLUGIN_AUTH_TYPE: "https"
          PLUGIN_USERNAME: "cnb"
          PLUGIN_PASSWORD: ${{ secrets.CNB_TOKEN }}
          PLUGIN_BRANCH: "main"
